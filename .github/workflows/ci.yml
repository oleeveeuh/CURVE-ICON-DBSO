name: CI

# CIC-001/CIC-002: every pull request runs formatting/linting, the offline
# test suite, coverage, secret/identifier scanning, a real container build
# with SBOM + vulnerability gate + image-privacy checks, and Terraform
# validation — all without private data, real artifacts, or AWS keys.
# Terraform plan runs on same-repo pull requests where OIDC credentials are
# available (CIC-004); applies NEVER run in this workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: curve-icon-dbso-api

jobs:
  # ---------------------------------------------------------------- tests ---
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install locked environment (dev + api groups)
        run: uv python install ${{ matrix.python-version }} && uv sync --locked --extra dev --extra api
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Run offline test suite (no private data required)
        run: uv run pytest -q
      - name: Synthetic end-to-end demo
        run: uv run python scripts/run_synthetic_demo.py --output-dir outputs/ci_demo
      - name: Lock-file consistency
        run: uv lock --check
      - name: Coverage report (3.11 only, report printed + archived)
        if: matrix.python-version == '3.11'
        run: uv run pytest -q --cov=curve_icon_dbso --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ------------------------------------------------------- secret scanning ---
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Secret + subject-identifier + prohibited-file-type scan (CIC-007)
        run: uv run python scripts/security_scan.py

  # ------------------------------------------------------------ container ---
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install locked environment (dev + api groups, for docker-gated tests)
        run: uv sync --locked --extra dev --extra api
      # Builds the image by source SHA (CON-006), runs health/predict e2e,
      # the cold-start target, and the IMAGE-CONTENT PRIVACY CHECK (CON-002):
      # the built image filesystem is scanned for prohibited file types.
      - name: Container integration + image-privacy tests (builds image)
        run: uv run pytest -q tests/test_container.py
      - name: Record built image tag
        run: echo "IMAGE_TAG=${IMAGE_NAME}:$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      # SBOM (CON-004): CycloneDX inventory of every package in the image.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: sbom.cdx.json
          list-all-pkgs: true
          scanners: none
      # Vulnerability scan; the JSON report is gated by script so that
      # time-limited documented exceptions (CON-004) are the only bypass.
      - name: Vulnerability scan (report for gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: trivy-image-report.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Vulnerability gate — unresolved HIGH/CRITICAL blocks (CON-004)
        run: uv run python scripts/vuln_gate.py --report trivy-image-report.json --exceptions docs/vulnerability-exceptions.yml --check vuln
      - name: Upload SBOM + scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-artifacts
          path: |
            sbom.cdx.json
            trivy-image-report.json
          retention-days: 14

  # ------------------------------------------------------------- terraform ---
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Setup Terraform (pinned in infra/versions.tf)
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate (no backend, offline — bootstrap + root)
        run: |
          terraform init -backend=false -input=false
          terraform validate
          ( cd bootstrap && terraform init -backend=false -input=false && terraform validate )
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4
      - name: tflint (lint)
        run: tflint --recursive
      # IaC security scan + the same exceptions-aware gate as the image scan:
      # HIGH/CRITICAL config findings block unless documented and time-limited.
      - name: Terraform security scan (report for gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: json
          output: trivy-config-report.json
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Terraform security gate — unresolved HIGH/CRITICAL blocks
        run: uv run python ../../scripts/vuln_gate.py --report ../../trivy-config-report.json --exceptions ../../docs/vulnerability-exceptions.yml --check config

  # ------------------------------------- terraform plan on same-repo PRs ---
  terraform-plan:
    runs-on: ubuntu-latest
    needs: terraform
    # Fork pull requests cannot assume the OIDC role (the trust policy
    # requires the exact repository slug) — planning is skipped for them
    # rather than failing (CIC-002: no long-lived keys ever exist).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure AWS credentials (OIDC, plan role — read-only)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - name: Terraform init (remote backend, read-only)
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform plan (read-only; never applies)
        run: >-
          terraform plan -input=false -no-color
          -var-file=environments/dev.tfvars
          -var="state_bucket_name=${{ vars.TF_STATE_BUCKET }}"
          -var="state_lock_table=${{ vars.TF_LOCK_TABLE }}"
