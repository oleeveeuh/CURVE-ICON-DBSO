# Local kind cluster for the Phase 7 Kubernetes demonstration (LOCAL ONLY —
# never EKS or any cloud Kubernetes; docs/kubernetes.md).
#
# single control-plane node; the extraPortMapping publishes the app's
# NodePort (30080) on localhost:8000 so the existing Locust profile can
# drive the cluster unchanged (docs/runbook.md §8c shape).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: curve-icon-dbso
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        protocol: TCP
