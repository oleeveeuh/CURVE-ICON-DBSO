[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curve-icon-dbso"
version = "0.2.0"
description = "Exploratory research prototype: DBS outcome analysis using HFO and clinical biomarkers (n=8 pilot; not for clinical use)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }  # TODO(decision): license unset — see docs/data_access.md
authors = [{ name = "Olivia Liau" }]
keywords = ["deep-brain-stimulation", "HFO", "ECog", "Parkinson", "exploratory"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
# Core development (tests + lint). Does NOT require API/tracking/analysis deps.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Inference service (Phase 2): FastAPI + Pydantic v2 + ASGI server + test client.
api = [
    "fastapi>=0.100",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
# Local experiment lineage (MOD-004). Core package never imports these.
tracking = [
    "mlflow>=2.14",
]
# Load testing (Phase 5, OBS-003). Cloud SDKs land with Phase 4 infrastructure.
cloud = [
    "locust>=2.20",
]
# Optional fixed-parameter XGBoost parity exercise (DD-003, SCI-006).
# Never required for the default test suite or the core corrected analysis.
analysis = [
    "xgboost>=2.0",
]

[project.scripts]
curve-icon-demo = "curve_icon_dbso.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 handled by formatter where practical; long docstrings tolerated
ignore = ["E501"]
